{# Usage: {% include "_partials/ring.html" with context %} — set pct (0–100) #}
<div class="ms-ring" data-pct="{{ pct|default(0) }}" role="img" aria-label="{{ pct|default(0) }} percent">
  <svg viewBox="0 0 88 88" width="88" height="88" aria-hidden="true">
    <circle class="ms-ring__track" cx="44" cy="44" r="36"></circle>
    <circle class="ms-ring__value" cx="44" cy="44" r="36"
            stroke-dasharray="{{ 2 * 3.14159 * 36 }}"
            stroke-dashoffset="{{ 2 * 3.14159 * 36 }}"></circle>
  </svg>
  <span class="ms-ring__label">0%</span>
</div>
